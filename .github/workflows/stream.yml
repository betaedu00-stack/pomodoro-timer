name: Pomodoro Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Streaming Tools & Window Manager
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg xvfb fluxbox chromium-browser pulseaudio dbus-x11 python3

    - name: Start Live Stream to YouTube
      env:
        YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # 1. Virtual Display (1920x1080) ආරම්භ කිරීම
        Xvfb :99 -screen 0 1920x1080x24 &
        export DISPLAY=:99
        sleep 2

        # 2. Fluxbox Window Manager ආරම්භ කිරීම (Screen එක නිවැරදිව Active කිරීමට)
        fluxbox &
        sleep 1

        # 3. Virtual Audio Sink සක්‍රීය කිරීම (Chromium එකට කලින් මෙය සිදු විය යුතුය)
        export $(dbus-launch)
        pulseaudio --start --exit-idle-time=-1 || true
        sleep 2
        pacmd load-module module-null-sink sink_name=VirtualSink sink_properties=device.description="VirtualSink" || true
        pacmd set-default-sink VirtualSink || true

        # 4. Local Web Server ආරම්භ කිරීම
        python3 -m http.server 8000 --directory "$GITHUB_WORKSPACE" &
        sleep 2

        # 5. Chromium (SwiftShader CPU rendering මගින් Blackscreen ප්‍රශ්නය විසඳීම)
        mkdir -p /tmp/chrome-profile
        chromium-browser \
          --user-data-dir=/tmp/chrome-profile \
          --no-sandbox \
          --disable-setuid-sandbox \
          --disable-dev-shm-usage \
          --use-gl=swiftshader \
          --enable-webgl \
          --window-size=1920,1080 \
          --window-position=0,0 \
          --start-fullscreen \
          --autoplay-policy=no-user-gesture-required \
          --kiosk http://localhost:8000/index.html &
        sleep 10

        # 6. FFmpeg මගින් Capture කර YouTube වෙත Stream කිරීම
        ffmpeg -f x11grab -draw_mouse 0 -video_size 1920x1080 -i :99.0 \
        -f pulse -i VirtualSink.monitor \
        -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 60 -b:v 2500k \
        -c:a aac -b:a 128k -ar 44100 \
        -flvflags no_duration_filesize \
        -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
        -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
