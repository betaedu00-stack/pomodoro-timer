name: Pomodoro Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Streaming Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg xvfb chromium-browser

    - name: Start Live Stream to YouTube
      env:
        YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # 1. Virtual Display (1920x1080) ආරම්භ කිරීම
        Xvfb :99 -screen 0 1920x1080x24 &
        export DISPLAY=:99
        sleep 3

        # 2. Chromium Browser එක Fullscreen මගින් index.html පෙන්වීම
        chromium-browser --no-sandbox --disable-setuid-sandbox --autoplay-policy=no-user-gesture-required --start-fullscreen --kiosk file://$GITHUB_WORKSPACE/index.html &
        sleep 5

        # 3. FFmpeg මගින් Screen එක පමණක් Capture කර YouTube වෙත ස්ථාවරව Stream කිරීම (Silent Audio සමග)
        ffmpeg -re -f x11grab -draw_mouse 0 -s 1920x1080 -i :99.0 \
        -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
        -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 60 -b:v 3000k \
        -c:a aac -b:a 128k \
        -shortest \
        -flvflags no_duration_filesize \
        -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
        -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
