name: Pomodoro Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Streaming Tools & Audio Server
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg xvfb chromium-browser pulseaudio dbus-x11 python3

    - name: Start Live Stream to YouTube
      env:
        YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      run: |
        # 1. DBus සහ PulseAudio Virtual Audio Server ආරම්භ කිරීම
        export $(dbus-launch)
        pulseaudio --start --exit-idle-time=-1 || true
        pactl load-module module-null-sink sink_name=VirtualSink sink_properties=device.description="VirtualSink" || true
        pactl set-default-sink VirtualSink || true

        # 2. Virtual Display (1920x1080 Full HD) ආරම්භ කිරීම
        Xvfb :99 -screen 0 1920x1080x24 &
        export DISPLAY=:99
        sleep 3

        # 3. Local Python HTTP Server එකක් Run කිරීම (Blackscreen / file:// Rendering ප්‍රශ්න නැති කිරීමට)
        python3 -m http.server 8000 --directory "$GITHUB_WORKSPACE" &
        sleep 2

        # 4. Chromium Browser (Clean Profile & Disable GPU for Stable Rendering)
        mkdir -p /tmp/chrome-profile
        chromium-browser --user-data-dir=/tmp/chrome-profile \
          --no-sandbox \
          --disable-setuid-sandbox \
          --disable-gpu \
          --disable-dev-shm-usage \
          --disable-software-rasterizer \
          --disable-infobars \
          --disable-session-crashed-bubble \
          --disable-popup-blocking \
          --no-first-run \
          --no-default-browser-check \
          --disable-features=Translate \
          --window-size=1920,1080 \
          --window-position=0,0 \
          --start-fullscreen \
          --autoplay-policy=no-user-gesture-required \
          --kiosk http://localhost:8000/index.html &
        sleep 8

        # 5. FFmpeg මගින් Screen සහ Audio Capture කර YouTube Live වෙත Stream කිරීම
        ffmpeg -re -f x11grab -draw_mouse 0 -s 1920x1080 -i :99.0 \
        -f pulse -i VirtualSink.monitor \
        -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 60 -b:v 3000k \
        -c:a aac -b:a 128k -ar 44100 \
        -flvflags no_duration_filesize \
        -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 2 \
        -f flv "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
