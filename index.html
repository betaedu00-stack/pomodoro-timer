<!DOCTYPE html>
<html lang="en" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="referrer" content="no-referrer">
    <title>Study With Me - Focus Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 2s ease-in-out;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .dashboard-container {
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-main {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 4.5rem;
            font-weight: 400;
            color: white;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .tab-group {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 28px;
            font-weight: 600;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }
        .tab-btn.active {
            background-color: white;
            color: #0f172a;
            border: 1px solid white;
            box-shadow: 0px 0px 15px rgba(255,255,255,0.4);
        }

        #timer {
            font-size: 11rem;
            font-weight: 700;
            color: white;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0px 5px 25px rgba(0,0,0,0.9);
        }

        #cycle-counter {
            font-size: 1.5rem;
            font-weight: 600;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="logo-main">study with me</div>

        <div class="tab-group">
            <button class="tab-btn active" id="tab-intro">get ready</button>
            <button class="tab-btn" id="tab-pomo">pomodoro</button>
            <button class="tab-btn" id="tab-short">short break</button>
            <button class="tab-btn" id="tab-long">long break</button>
        </div>

        <div id="timer">05:00</div>
        
        <div id="cycle-counter">Ready to study</div>
    </div>

<script>
    const TIMES = { intro: 300, pomo: 1500, short: 300, long: 600 };

    const STUDY_BACKGROUNDS = [
        "https://images.unsplash.com/photo-1516979187457-637abb4f9353?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1518655048521-f130df041f66?q=80&w=2560&auto=format&fit=crop"
    ];

    const BREAK_BACKGROUNDS = [
        "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2560&auto=format&fit=crop"
    ];

    let currentSessionType = 'intro';
    let timeLeft = TIMES.intro;
    let studySessionsCompleted = 0;

    let audioCtx = null;
    let activeInterval = null;
    let activeNodes = [];

    function stopMusic() {
        if (activeInterval) {
            clearInterval(activeInterval);
            activeInterval = null;
        }
        activeNodes.forEach(node => {
            try {
                if (node.stop) node.stop();
                if (node.disconnect) node.disconnect();
            } catch(e) {}
        });
        activeNodes = [];
    }

    function playGenerativeMusic(type) {
        stopMusic();
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (type === 'pomo' || type === 'intro') {
            // STUDY TIME: Calm Ambient Chords (Deep, relaxing, low-frequency pads)
            const chordFrequencies = [
                [130.81, 196.00, 246.94], // C3, G3, B3 (Peaceful atmosphere)
                [110.00, 164.81, 220.00], // A2, E3, A3
                [146.83, 220.00, 261.63], // D3, A3, C4
                [98.00, 146.83, 196.00]   // G2, D3, G3
            ];

            let chordIndex = 0;

            function playChord() {
                if (currentSessionType !== 'pomo' && currentSessionType !== 'intro') return;
                const freqs = chordFrequencies[chordIndex];
                chordIndex = (chordIndex + 1) % chordFrequencies.length;

                freqs.forEach(freq => {
                    if (!audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    osc.type = 'sine'; // Smooth tone
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(300, audioCtx.currentTime);

                    // Smooth Fade In and Fade Out (Ambient swell)
                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 3);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 8);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 8.5);
                    activeNodes.push(osc);
                });
            }

            playChord();
            activeInterval = setInterval(playChord, 8000); // Change chord every 8 seconds

        } else {
            // BREAK TIME: Joyful / Upbeat Lofi Melodic Arpeggios (Relaxing & Pleasant)
            const melodyNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C major scale notes

            function playNote() {
                if (currentSessionType !== 'short' && currentSessionType !== 'long') return;
                if (!audioCtx) return;

                const randomFreq = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle'; // Brighter, pleasant tone for breaks
                osc.frequency.setValueAtTime(randomFreq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.025, audioCtx.currentTime + 0.1);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 1.6);
                activeNodes.push(osc);
            }

            playNote();
            activeInterval = setInterval(playNote, 1200); // Play a pleasant note every 1.2 seconds
        }
    }
    
    function updateTheme(type) {
        let bgList = (type === 'pomo' || type === 'intro') ? STUDY_BACKGROUNDS : BREAK_BACKGROUNDS;
        let randomIndex = Math.floor(Math.random() * bgList.length);
        document.body.style.backgroundImage = `url('${bgList[randomIndex]}')`;

        playGenerativeMusic(type);
    }

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateUI(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${type}`);
        if (activeTab) activeTab.classList.add('active');
        
        let cycleText = "";
        if (type === 'intro') {
            cycleText = "Ready to study";
        } else if (type === 'pomo') {
            cycleText = `Study Session: ${(studySessionsCompleted % 4) + 1}/4`;
        } else if (type === 'short') {
            cycleText = "Rest your eyes...";
        } else if (type === 'long') {
            cycleText = "Take a long break!";
        }
        document.getElementById('cycle-counter').innerText = cycleText;
    }

    function handleSessionEnd() {
        if (currentSessionType === 'intro') {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
        } else if (currentSessionType === 'pomo') {
            studySessionsCompleted++;
            if (studySessionsCompleted % 4 === 0) {
                currentSessionType = 'long';
                timeLeft = TIMES.long;
            } else {
                currentSessionType = 'short';
                timeLeft = TIMES.short;
            }
        } else {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
        }
        
        updateTheme(currentSessionType);
        updateUI(currentSessionType);
        updateDisplay();
    }

    setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
        } else {
            handleSessionEnd();
        }
    }, 1000);

    // Initial Start
    updateTheme('intro');
    updateUI('intro');
    updateDisplay();
</script>
</body>
</html>
