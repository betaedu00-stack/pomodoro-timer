<!DOCTYPE html>
<html lang="en" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="referrer" content="no-referrer">
    <title>Study With Me - Focus Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 2s ease-in-out;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .dashboard-container {
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-main {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 4.5rem;
            font-weight: 400;
            color: white;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .tab-group {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 28px;
            font-weight: 600;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }
        .tab-btn.active {
            background-color: white;
            color: #0f172a;
            border: 1px solid white;
            box-shadow: 0px 0px 15px rgba(255,255,255,0.4);
        }

        #timer {
            font-size: 11rem;
            font-weight: 700;
            color: white;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0px 5px 25px rgba(0,0,0,0.9);
        }

        #cycle-counter {
            font-size: 1.5rem;
            font-weight: 600;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="logo-main">study with me</div>

        <div class="tab-group">
            <button class="tab-btn active" id="tab-intro">get ready</button>
            <button class="tab-btn" id="tab-pomo">pomodoro</button>
            <button class="tab-btn" id="tab-short">short break</button>
            <button class="tab-btn" id="tab-long">long break</button>
        </div>

        <div id="timer">05:00</div>
        
        <div id="cycle-counter">Ready to study</div>
    </div>

<script>
    // Timers in seconds
    const TIMES = { intro: 300, pomo: 1500, short: 300, long: 600 };

    const STUDY_BACKGROUNDS = [
        "https://images.unsplash.com/photo-1516979187457-637abb4f9353?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1518655048521-f130df041f66?q=80&w=2560&auto=format&fit=crop"
    ];

    const BREAK_BACKGROUNDS = [
        "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2560&auto=format&fit=crop",
        "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2560&auto=format&fit=crop"
    ];

    let currentSessionType = 'intro';
    let timeLeft = TIMES.intro;
    let studySessionsCompleted = 0;

    // Web Audio API Sound Generator (100% Copyright Free & Generated Live)
    let audioCtx = null;
    let activeNodes = [];

    function stopAudio() {
        activeNodes.forEach(node => {
            try {
                if (node.stop) node.stop();
                if (node.disconnect) node.disconnect();
            } catch(e) {}
        });
        activeNodes = [];
    }

    function playAudio(type) {
        stopAudio();
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        if (type === 'pomo' || type === 'intro') {
            // Study Time: Soft Pink/Brown Noise (Deep Focus & Calm Fan/Rain-like hum)
            const bufferSize = audioCtx.sampleRate * 2;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.03; // Volume level
                b6 = white * 0.115926;
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, audioCtx.currentTime);

            whiteNoise.connect(filter);
            filter.connect(audioCtx.destination);
            whiteNoise.start();
            activeNodes.push(whiteNoise);

        } else {
            // Break Time: Enjoyable Harmonic Soft Chords (Relaxing tones)
            const frequencies = [261.63, 329.63, 392.00]; // C Major chord tones
            frequencies.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                activeNodes.push(osc);
            });
        }
    }
    
    function updateTheme(type) {
        let bgList = (type === 'pomo' || type === 'intro') ? STUDY_BACKGROUNDS : BREAK_BACKGROUNDS;
        let randomIndex = Math.floor(Math.random() * bgList.length);
        document.body.style.backgroundImage = `url('${bgList[randomIndex]}')`;

        playAudio(type);
    }

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateUI(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${type}`);
        if (activeTab) activeTab.classList.add('active');
        
        let cycleText = "";
        if (type === 'intro') {
            cycleText = "Ready to study";
        } else if (type === 'pomo') {
            cycleText = `Study Session: ${(studySessionsCompleted % 4) + 1}/4`;
        } else if (type === 'short') {
            cycleText = "Rest your eyes...";
        } else if (type === 'long') {
            cycleText = "Take a long break!";
        }
        document.getElementById('cycle-counter').innerText = cycleText;
    }

    function handleSessionEnd() {
        if (currentSessionType === 'intro') {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
        } else if (currentSessionType === 'pomo') {
            studySessionsCompleted++;
            if (studySessionsCompleted % 4 === 0) {
                currentSessionType = 'long';
                timeLeft = TIMES.long;
            } else {
                currentSessionType = 'short';
                timeLeft = TIMES.short;
            }
        } else {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
        }
        
        updateTheme(currentSessionType);
        updateUI(currentSessionType);
        updateDisplay();
    }

    setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
        } else {
            handleSessionEnd();
        }
    }, 1000);

    // Initial Start
    updateTheme('intro');
    updateUI('intro');
    updateDisplay();
</script>
</body>
</html>
