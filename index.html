<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Study Timer - Study with me.io style</title>
    <!-- Aesthetic Fonts: Playfair Display for logo, Montserrat for rest -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Hide scrollbars */
            /* Default background image */
            background-image: url('https://images.unsplash.com/photo-1518176258769-d5c219602c34?q=80&w=2070');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* Gradient Overlay for Text Readability */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35); /* 35% opacity black overlay */
            z-index: 0;
        }

        /* Main Dashboard Container */
        .dashboard-container {
            z-index: 1; /* Place above the overlay */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Top Logo Style */
        .header {
            margin-bottom: 30px;
        }
        .logo-main {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 3.5rem;
            font-weight: 400;
            margin-bottom: -5px;
            color: white;
        }
        .logo-sub {
            font-size: 0.9rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Pomo, Short, Long tab buttons */
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s, color 0.2s;
        }
        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }
        .tab-btn.active {
            background-color: white;
            color: #0f172a;
            border: 1px solid white;
        }

        /* The main large Timer Display */
        #timer {
            font-size: 10rem;
            font-weight: 700;
            color: white;
            letter-spacing: -2px;
            margin-bottom: 40px;
        }

        /* Control Buttons and Icons (Start, Reset, Settings, Fullscreen) */
        .controls-group {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }
        .btn-start {
            background-color: white;
            color: #0f172a;
            border: none;
            border-radius: 50px;
            padding: 12px 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-start:hover {
            background-color: #f0f0f0;
        }
        .icon-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover {
            color: white;
        }

        /* Settings Modal (Popup) for BG image change */
        #settings-modal {
            display: none; /* hidden by default */
            position: fixed;
            z-index: 100;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
        }
        .modal-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .bg-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .bg-thumb {
            width: 100%; height: 80px;
            background-size: cover;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .bg-thumb:hover, .bg-thumb.active {
            border-color: #38bdf8;
        }
        .close-btn {
            background-color: #ef4444; color: white;
            border: none; border-radius: 8px;
            padding: 10px 20px; font-weight: 600; cursor: pointer;
        }

        /* Music Player Placeholder (static like the image) */
        .player-bar {
            position: fixed;
            bottom: 30px; left: 30px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 50px;
            padding: 10px 15px 10px 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.8rem;
            z-index: 10;
        }
        .player-icon { font-size: 1.5rem; opacity: 0.8; }
        .track-info { display: flex; flex-direction: column; }
        .track-title { font-weight: 600; }
        .track-artist { font-size: 0.75rem; opacity: 0.7; }
        .player-controls { font-size: 1.2rem; display: flex; gap: 10px; }
        .prev-track, .play-track { opacity: 0.7; }

    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Logo -->
        <div class="header">
            <div class="logo-main">study with me.io</div>
            <div class="logo-sub">By GRIDFITI</div>
        </div>

        <!-- Pomo, Short, Long tabs -->
        <div class="tab-group">
            <button class="tab-btn active" onclick="setSessionType('pomo')">pomodoro</button>
            <button class="tab-btn" onclick="setSessionType('short')">short break</button>
            <button class="tab-btn" onclick="setSessionType('long')">long break</button>
        </div>

        <!-- Large Timer Display -->
        <div id="timer">25:00</div>

        <!-- Timer Controls & Icons -->
        <div class="controls-group">
            <button class="btn-start" id="start-btn" onclick="startTimer()">start</button>
            
            <!-- Reset Icon (UTF-8 unicode symbol) -->
            <button class="icon-btn" onclick="resetTimer()">&#x21BB;</button>

            <!-- Settings Icon for BG Change (UTF-8) -->
            <button class="icon-btn" onclick="openSettings()">&#x2699;</button>

            <!-- Fullscreen Icon (UTF-8) -->
            <button class="icon-btn" onclick="toggleFullscreen()">&#x26F6;</button>
        </div>
    </div>

    <!-- Background Image Settings Modal -->
    <div id="settings-modal" onclick="closeSettings(event)">
        <div class="modal-content" onclick="event.stopPropagation()"> <!-- stop click propagation -->
            <div class="modal-title">පසුබිම් රූපය තෝරන්න</div>
            <div class="bg-options">
                <!-- Three free background image options using Unsplash IDs -->
                <div class="bg-thumb active" style="background-image: url('https://images.unsplash.com/photo-1518176258769-d5c219602c34?q=80&w=200');" onclick="changeBackground('https://images.unsplash.com/photo-1518176258769-d5c219602c34?q=80&w=2070', 0)"></div>
                <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1519791883288-dc8bd696e637?q=80&w=200');" onclick="changeBackground('https://images.unsplash.com/photo-1519791883288-dc8bd696e637?q=80&w=2070', 1)"></div>
                <div class="bg-thumb" style="background-image: url('https://images.unsplash.com/photo-1549492423-400259a2e574?q=80&w=200');" onclick="changeBackground('https://images.unsplash.com/photo-1549492423-400259a2e574?q=80&w=2070', 2)"></div>
            </div>
            <button class="close-btn" onclick="closeSettings(event)">Close</button>
        </div>
    </div>

    <!-- Static Music Player Placeholder Bar (like Spotify) -->
    <div class="player-bar">
        <div class="player-icon">&#x266B;</div> <!-- Musical note icon -->
        <div class="track-info">
            <div class="track-title">Himalayan Sunset</div>
            <div class="track-artist">Lofi Beats</div>
        </div>
        <div class="player-controls">
            <div class="prev-track">&#x23EE;</div> <!-- Prev icon -->
            <div class="play-track">&#x23F5;</div> <!-- Play icon -->
        </div>
    </div>

<script>
    // Timer times in seconds (Pomo: 25 min, Short: 5 min, Long: 15 min)
    const TIMES = { pomo: 1500, short: 300, long: 900 };
    let currentSessionType = 'pomo';
    let timeLeft = TIMES[currentSessionType];
    let timerId = null;

    // Update the large timer display
    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    // Tab control for Pomo/Short/Long
    function setSessionType(type) {
        pauseTimer(); // Stop any running timer
        currentSessionType = type;
        timeLeft = TIMES[currentSessionType];
        
        // Update active tab button style
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[onclick="setSessionType('${type}')"]`).classList.add('active');
        
        // Update large display
        updateDisplay();
        
        // Change the start button text back
        document.getElementById('start-btn').innerText = 'start';
    }

    // Main timer logic (same as before)
    function startTimer() {
        let startBtn = document.getElementById('start-btn');
        if (timerId !== null) { // if already running, pause it
            pauseTimer();
            startBtn.innerText = 'resume';
            return;
        }
        
        startBtn.innerText = 'pause';
        
        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timerId);
                timerId = null;
                // auto-start next session is not implemented here for simplicity
                setSessionType('pomo'); // for example, goes back to pomo after break
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
    }

    function resetTimer() {
        pauseTimer();
        timeLeft = TIMES[currentSessionType];
        updateDisplay();
        document.getElementById('start-btn').innerText = 'start';
    }

    // --- Aesthetic & Fullscreen Functions ---

    // Toggle full screen mode
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Error attempting to enable fullscreen mode: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    // Change background image and thumbnail active state
    function changeBackground(url, thumbIndex) {
        document.body.style.backgroundImage = 'url(' + url + ')';
        
        // Update active thumbnail outline
        document.querySelectorAll('.bg-thumb').forEach(thumb => thumb.classList.remove('active'));
        document.querySelectorAll('.bg-thumb')[thumbIndex].classList.add('active');
    }

    // Open/Close settings modal
    function openSettings() {
        document.getElementById('settings-modal').style.display = 'flex';
    }
    function closeSettings(event) {
        document.getElementById('settings-modal').style.display = 'none';
    }

    // Initial Display Setup
    updateDisplay();

</script>

</body>
</html>
