<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study With Me - Automated Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 1s ease-in-out;
        }

        /* Dark Overlay for better text visibility */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .dashboard-container {
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header { margin-bottom: 30px; }
        
        .logo-main {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 3.5rem;
            font-weight: 400;
            color: white;
        }

        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: default;
        }
        .tab-btn.active {
            background-color: white;
            color: #0f172a;
            border: 1px solid white;
        }

        #timer {
            font-size: 11rem;
            font-weight: 700;
            color: white;
            letter-spacing: -2px;
            margin-bottom: 20px;
            text-shadow: 0px 5px 15px rgba(0,0,0,0.5);
        }

        #cycle-counter {
            font-size: 1.2rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Copyright-free ambient study music (SomaFM Drone Zone - 24/7 Zero Ads/Strikes) -->
    <audio id="bgMusic" autoplay loop>
        <source src="https://ice1.somafm.com/dronezone-128-mp3" type="audio/mpeg">
    </audio>

    <div class="dashboard-container">
        <!-- Updated Logo -->
        <div class="header">
            <div class="logo-main">study with me</div>
        </div>

        <!-- Session Indicators -->
        <div class="tab-group">
            <button class="tab-btn active" id="tab-pomo">pomodoro</button>
            <button class="tab-btn" id="tab-short">short break</button>
            <button class="tab-btn" id="tab-long">long break</button>
        </div>

        <!-- Timer -->
        <div id="timer">25:00</div>
        
        <!-- Cycle Tracker -->
        <div id="cycle-counter">Study Session: 1/4</div>
    </div>

<script>
    // Times in seconds
    const TIMES = { pomo: 1500, short: 300, long: 600 }; // 25m, 5m, 10m
    
    // Aesthetic Animated Lo-fi GIFs
    const bgGifs = [
        "https://media.giphy.com/media/Lmq2XFqI3t0Xh1A6zP/giphy.gif",
        "https://media.giphy.com/media/3o7TKrEzvLbgzG1nQA/giphy.gif",
        "https://media.giphy.com/media/xT9IgFbwSnsg8x1l5u/giphy.gif",
        "https://media.giphy.com/media/5wWf7H0qoWaNnkZBucU/giphy.gif",
        "https://media.giphy.com/media/3o6Zt6b5Pz41bM6q0w/giphy.gif",
        "https://media.giphy.com/media/xUPGcMbwV5v5wW3Fhm/giphy.gif",
        "https://media.giphy.com/media/26tnb6XN9nJ1A28O4/giphy.gif",
        "https://media.giphy.com/media/3o7aD2saalEvpjtce4/giphy.gif",
        "https://media.giphy.com/media/l41YcWXYE2gIuF5wQ/giphy.gif",
        "https://media.giphy.com/media/26xBsNK6K4y43nEac/giphy.gif",
        "https://media.giphy.com/media/l0HlJzWMGDe2709Q4/giphy.gif",
        "https://media.giphy.com/media/xT1XG223X34g4pB5hC/giphy.gif"
    ];

    let currentSessionType = 'pomo';
    let timeLeft = TIMES.pomo;
    let studySessionsCompleted = 0;
    
    // Function to get a random background
    function changeBackground() {
        let randomIndex = Math.floor(Math.random() * bgGifs.length);
        document.body.style.backgroundImage = `url('${bgGifs[randomIndex]}')`;
    }

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateUI(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${type}`).classList.add('active');
        
        let cycleText = type === 'pomo' ? 
            `Study Session: ${(studySessionsCompleted % 4) + 1}/4` : 
            (type === 'short' ? "Rest your eyes..." : "Take a long break!");
        document.getElementById('cycle-counter').innerText = cycleText;
    }

    function handleSessionEnd() {
        if (currentSessionType === 'pomo') {
            studySessionsCompleted++;
            // Check if 4 sessions are completed
            if (studySessionsCompleted % 4 === 0) {
                currentSessionType = 'long';
                timeLeft = TIMES.long; // 10 min break
            } else {
                currentSessionType = 'short';
                timeLeft = TIMES.short; // 5 min break
            }
        } else {
            // Break ended, start new study session and change BG
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
            changeBackground(); // Change animated BG for every new study session
        }
        
        updateUI(currentSessionType);
        updateDisplay();
    }

    // Auto-running logic
    setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
        } else {
            handleSessionEnd();
        }
    }, 1000);

    // Initial setup
    changeBackground();
    updateUI('pomo');
    updateDisplay();

    // Ensure audio plays
    document.body.addEventListener('click', () => {
        document.getElementById('bgMusic').play();
    }, {once: true});

</script>
</body>
</html>
