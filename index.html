<!DOCTYPE html>
<html lang="en" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="referrer" content="no-referrer">
    <title>Study With Me - Focus Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 2s ease-in-out;
        }

        /* Dark overlay for optimal text contrast & focus */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.50);
            z-index: 0;
        }

        .dashboard-container {
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-main {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 4rem;
            font-weight: 400;
            color: white;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.8);
        }

        .tab-group {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 28px;
            font-weight: 600;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            transition: all 0.4s ease;
        }
        .tab-btn.active {
            background-color: white;
            color: #0f172a;
            border: 1px solid white;
            box-shadow: 0px 0px 15px rgba(255,255,255,0.4);
        }

        #timer {
            font-size: 11rem;
            font-weight: 700;
            color: white;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0px 5px 25px rgba(0,0,0,0.9);
        }

        #cycle-counter {
            font-size: 1.4rem;
            font-weight: 600;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Dynamic Audio Player -->
    <audio id="bgAudio" autoplay loop crossorigin="anonymous"></audio>

    <div class="dashboard-container">
        <div class="logo-main">study with me</div>

        <div class="tab-group">
            <button class="tab-btn active" id="tab-intro">get ready</button>
            <button class="tab-btn" id="tab-pomo">pomodoro</button>
            <button class="tab-btn" id="tab-short">short break</button>
            <button class="tab-btn" id="tab-long">long break</button>
        </div>

        <div id="timer">05:00</div>
        
        <div id="cycle-counter">Ready to study</div>
    </div>

<script>
    const TIMES = { intro: 300, pomo: 1500, short: 300, long: 600 };

    // Study & Focus specific high-quality Gifs
    const STUDY_GIFS = [
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZydnA0cnR1dzkyYmxreXV4OWdpOHRwMm9uOGd1NDJqcjdidWZpNSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lmq2XFqI3t0Xh1A6zP/giphy.gif",
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHM2d2h5NGtzamJpYW4wOWk4ZzMzaGlzNmFqbmRxamJ3MXZwdGFvNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/139e89EY9q23pe/giphy.gif",
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExeXJ4bnBveHJocHZpZGttdHdycmF5dnd6cnIxb3R2bW9ndDFvYnp0cyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT9IgFbwSnsg8x1l5u/giphy.gif"
    ];

    // Relaxing Nature / Break Gifs
    const BREAK_GIFS = [
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1ZHZpa2dyMHFjZDFxOHM5MThqNmxuaXJmc2k1MXdndmIxdGZyNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKrEzvLbgzG1nQA/giphy.gif",
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNWVveTJ4aXNudmt5MnVpMnltczU5MXQxaTBxMHBzZzdzczl6MXllYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/5wWf7H0qoWaNnkZBucU/giphy.gif"
    ];

    // Audio Streams matched for each state
    const AUDIO_STREAMS = {
        intro: "https://ice2.somafm.com/groovesalad-128-mp3",    // Gentle Ambient Warmup
        pomo: "https://ice1.somafm.com/dronezone-128-mp3",       // Pure Focus Drone/Tone (Zero Distraction)
        short: "https://ice2.somafm.com/iloveradio-128-mp3",    // Light Chill Ambient
        long: "https://ice2.somafm.com/groovesalad-128-mp3"     // Relaxing Chillout
    };

    let currentSessionType = 'intro';
    let timeLeft = TIMES.intro;
    let studySessionsCompleted = 0;
    
    function updateTheme(type) {
        // Change Background
        let gifs = (type === 'pomo' || type === 'intro') ? STUDY_GIFS : BREAK_GIFS;
        let randomIndex = Math.floor(Math.random() * gifs.length);
        document.body.style.backgroundImage = `url('${gifs[randomIndex]}')`;

        // Change Audio
        const audio = document.getElementById('bgAudio');
        if (audio.src !== AUDIO_STREAMS[type]) {
            audio.src = AUDIO_STREAMS[type];
            audio.play().catch(e => console.log("Audio play deferred"));
        }
    }

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateUI(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${type}`);
        if (activeTab) activeTab.classList.add('active');
        
        let cycleText = "";
        if (type === 'intro') {
            cycleText = "Ready to study";
        } else if (type === 'pomo') {
            cycleText = `Study Session: ${(studySessionsCompleted % 4) + 1}/4`;
        } else if (type === 'short') {
            cycleText = "Rest your eyes...";
        } else if (type === 'long') {
            cycleText = "Take a long break!";
        }
        document.getElementById('cycle-counter').innerText = cycleText;
    }

    function handleSessionEnd() {
        if (currentSessionType === 'intro') {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
        } else if (currentSessionType === 'pomo') {
            studySessionsCompleted++;
            if (studySessionsCompleted % 4 === 0) {
                currentSessionType = 'long';
                timeLeft = TIMES.long;
            } else {
                currentSessionType = 'short';
                timeLeft = TIMES.short;
            }
        } else {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
        }
        
        updateTheme(currentSessionType);
        updateUI(currentSessionType);
        updateDisplay();
    }

    setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
        } else {
            handleSessionEnd();
        }
    }, 1000);

    // Initial Start
    updateTheme('intro');
    updateUI('intro');
    updateDisplay();
</script>
</body>
</html>
