<!DOCTYPE html>
<html lang="en" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta name="referrer" content="no-referrer">
    <title>Study With Me - Automated Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: background-image 1.5s ease-in-out;
        }

        /* Calm dark overlay for high contrast */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .dashboard-container {
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-main {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 4rem;
            font-weight: 400;
            color: white;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.7);
        }

        .tab-group {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 10px 28px;
            font-weight: 600;
            font-size: 1rem;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background-color: white;
            color: #0f172a;
            border: 1px solid white;
        }

        #timer {
            font-size: 11rem;
            font-weight: 700;
            color: white;
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0px 5px 25px rgba(0,0,0,0.8);
        }

        #cycle-counter {
            font-size: 1.4rem;
            font-weight: 600;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Ultra-Calm, Soothing Ambient Stream (SomaFM Groove Salad - Copyright Safe) -->
    <audio id="bgMusic" autoplay loop crossorigin="anonymous">
        <source src="https://ice2.somafm.com/groovesalad-128-mp3" type="audio/mpeg">
    </audio>

    <div class="dashboard-container">
        <div class="logo-main">study with me</div>

        <div class="tab-group">
            <button class="tab-btn active" id="tab-intro">get ready</button>
            <button class="tab-btn" id="tab-pomo">pomodoro</button>
            <button class="tab-btn" id="tab-short">short break</button>
            <button class="tab-btn" id="tab-long">long break</button>
        </div>

        <div id="timer">05:00</div>
        
        <div id="cycle-counter">Ready to study</div>
    </div>

<script>
    // Times in seconds: Intro (5m), Pomo (25m), Short (5m), Long (10m)
    const TIMES = { intro: 300, pomo: 1500, short: 300, long: 600 };
    
    // High Quality Aesthetic Nature/Lo-Fi Background Animations
    const bgGifs = [
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1ZHZpa2dyMHFjZDFxOHM5MThqNmxuaXJmc2k1MXdndmIxdGZyNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKrEzvLbgzG1nQA/giphy.gif",
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZydnA0cnR1dzkyYmxreXV4OWdpOHRwMm9uOGd1NDJqcjdidWZpNSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Lmq2XFqI3t0Xh1A6zP/giphy.gif",
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExeXJ4bnBveHJocHZpZGttdHdycmF5dnd6cnIxb3R2bW9ndDFvYnp0cyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT9IgFbwSnsg8x1l5u/giphy.gif",
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNWVveTJ4aXNudmt5MnVpMnltczU5MXQxaTBxMHBzZzdzczl6MXllYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/5wWf7H0qoWaNnkZBucU/giphy.gif",
        "https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDMyaWZ2dXNxeGNxeWl4eDZnaWh2dTRrMGs1eThoNWw4aDV3dHlreCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o6Zt6b5Pz41bM6q0w/giphy.gif"
    ];

    let currentSessionType = 'intro';
    let timeLeft = TIMES.intro;
    let studySessionsCompleted = 0;
    
    function changeBackground() {
        let randomIndex = Math.floor(Math.random() * bgGifs.length);
        document.body.style.backgroundImage = `url('${bgGifs[randomIndex]}')`;
    }

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateUI(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${type}`);
        if (activeTab) activeTab.classList.add('active');
        
        let cycleText = "";
        if (type === 'intro') {
            cycleText = "Ready to study";
        } else if (type === 'pomo') {
            cycleText = `Study Session: ${(studySessionsCompleted % 4) + 1}/4`;
        } else if (type === 'short') {
            cycleText = "Rest your eyes...";
        } else if (type === 'long') {
            cycleText = "Take a long break!";
        }
        document.getElementById('cycle-counter').innerText = cycleText;
    }

    function handleSessionEnd() {
        if (currentSessionType === 'intro') {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
        } else if (currentSessionType === 'pomo') {
            studySessionsCompleted++;
            if (studySessionsCompleted % 4 === 0) {
                currentSessionType = 'long';
                timeLeft = TIMES.long;
            } else {
                currentSessionType = 'short';
                timeLeft = TIMES.short;
            }
        } else {
            currentSessionType = 'pomo';
            timeLeft = TIMES.pomo;
            changeBackground();
        }
        
        updateUI(currentSessionType);
        updateDisplay();
    }

    setInterval(() => {
        if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
        } else {
            handleSessionEnd();
        }
    }, 1000);

    changeBackground();
    updateUI('intro');
    updateDisplay();
</script>
</body>
</html>
